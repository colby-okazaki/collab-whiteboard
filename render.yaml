# Render Blueprint: the whole app as one web service built from the
# Dockerfile (it serves the client too), plus its PostgreSQL database.
# Redis is not used here, so the server runs as a single instance with live
# state in memory; boards are still saved to PostgreSQL.
#
# A push to main is deployed only after its GitHub checks (the CI/CD
# pipeline's tests and container check) pass.
databases:
  - name: whiteboard-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: collab-whiteboard
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: whiteboard-db
          property: connectionString
