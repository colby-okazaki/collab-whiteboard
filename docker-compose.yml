services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: whiteboard
      POSTGRES_PASSWORD: whiteboard
      POSTGRES_DB: whiteboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whiteboard"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The whole app in one container. Opt in with `npm run docker:up`
  # (the `app` profile keeps `npm run db:up` to just the databases).
  app:
    profiles: ["app"]
    build: .
    ports:
      - "8080:4000"
    environment:
      DATABASE_URL: postgres://whiteboard:whiteboard@db:5432/whiteboard
      REDIS_URL: redis://redis:6379
      CLIENT_ORIGIN: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
