name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: whiteboard
          POSTGRES_PASSWORD: whiteboard
          POSTGRES_DB: whiteboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whiteboard"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit and component tests
        run: npm test

      - name: Integration tests (PostgreSQL, Redis, multiple instances)
        run: npm run test:integration -w server
        env:
          DATABASE_URL: postgres://whiteboard:whiteboard@localhost:5432/whiteboard
          REDIS_URL: redis://localhost:6379

      - name: Build client
        run: npm run build -w client
