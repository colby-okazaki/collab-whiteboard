name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: whiteboard
          POSTGRES_PASSWORD: whiteboard
          POSTGRES_DB: whiteboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whiteboard"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit and component tests
        run: npm test

      - name: Integration tests (PostgreSQL, Redis, multiple instances)
        run: npm run test:integration -w server
        env:
          DATABASE_URL: postgres://whiteboard:whiteboard@localhost:5432/whiteboard
          REDIS_URL: redis://localhost:6379

      - name: Build client
        run: npm run build -w client

  # Builds the production image and checks that the container really starts,
  # serves the client, and exits cleanly when stopped. Runs only after the
  # tests pass. On pushes to main the verified image is then published.
  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          # Registry names must be lowercase.
          IMAGE="${IMAGE,,}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t whiteboard .

      - name: Start container and check it responds
        run: |
          docker run -d --name whiteboard -p 4000:4000 whiteboard
          for i in $(seq 1 20); do
            curl -sf http://localhost:4000/health && break
            sleep 1
          done
          curl -sf http://localhost:4000/health
          curl -sf http://localhost:4000/ | grep -q '<div id="root">'

      - name: Stops cleanly on SIGTERM
        run: |
          docker stop whiteboard
          test "$(docker inspect whiteboard --format '{{.State.ExitCode}}')" = "0"

      # Delivery: only a main-branch build that passed every check above is
      # published, tagged with its commit and as latest.
      - name: Publish image to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag whiteboard "$IMAGE:sha-${GITHUB_SHA::7}"
          docker tag whiteboard "$IMAGE:latest"
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"

  # Deployment: asks the host to pull the newly published image. It does
  # nothing until a DEPLOY_HOOK_URL secret (the host's deploy hook) is added
  # to the repository.
  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger deployment
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "No DEPLOY_HOOK_URL secret is set, so nothing was deployed."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL"
